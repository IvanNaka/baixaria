<section class="page">
  <header class="page-head">
    <h1>Estatísticas</h1>
    <p class="muted">
      Seu histórico fica salvo neste navegador. Os exercícios usam esses dados para sortear com mais
      frequência o que você erra mais.
    </p>
  </header>

  @if (!hasData()) {
    <div class="card"><p class="muted">Ainda não há dados. Faça alguns exercícios primeiro!</p></div>
  } @else {
    <div class="card">
      <h2>Precisão por posição no braço (%)</h2>
      <app-fretboard [tuning]="settings.tuning()" [frets]="heatFrets()" [markers]="heatMarkers()" />
    </div>

    <div class="stats-grid">
      <app-stats-table title="Notas" [rows]="noteRows()" />
      <app-stats-table title="Intervalos no braço" [rows]="intervalRows()" />
      <app-stats-table title="Intervalos de ouvido" [rows]="earRows()" />
    </div>

    <div>
      <button type="button" class="danger" (click)="reset()">Apagar estatísticas</button>
    </div>
  }
</section>
